[package]
name = "tui-slider"
version = "0.4.4"
edition = "2021"
authors = ["Sorin Irimies <sorinirimies@gmail.com>"]
license = "MIT"
description = "A simple TUI slider component library for ratatui"
repository = "https://github.com/sorinirimies/tui-slider"
keywords = ["tui", "slider", "ratatui", "terminal", "widget"]
categories = ["command-line-interface", "gui", "visualization", "rendering", "multimedia"]
rust-version = "1.88.0"
exclude = [
    ".gitea/**",
    ".github/**",
    ".zed/**",
    "docs/**",
    "examples/vhs/**",
    "scripts/**",
    "cliff.toml",
    "justfile",
    "fuzz/**",
    "deny.toml",
]

[dependencies]
ratatui = { version = "0.30", default-features = false }
unicode-width = "0.2"
tui-nuances = { version = "0.1.7", optional = true }
crossterm = { version = "0.29", optional = true }

[features]
default = ["theme"]
# Shared theming via tui-nuances (`.theme()`, `Themed`, `Theme` re-exports)
theme = ["dep:tui-nuances"]
# `SliderState::handle_key` / `handle_mouse` for crossterm events
crossterm = ["dep:crossterm"]

[dev-dependencies]
anyhow = "1.0"
crossterm = "0.29"
ratatui = { version = "0.30", features = ["crossterm"] }

[[example]]
name = "comprehensive"
path = "examples/comprehensive.rs"
required-features = ["theme", "crossterm"]

[[example]]
name = "horizontal"
path = "examples/horizontal.rs"
required-features = ["theme"]

[[example]]
name = "vertical"
path = "examples/vertical.rs"
required-features = ["theme"]

[[example]]
name = "custom"
path = "examples/custom_symbols.rs"
required-features = ["theme"]

[[example]]
name = "handles"
path = "examples/handles.rs"
required-features = ["theme"]

[[example]]
name = "vertical_positioning"
path = "examples/vertical_positioning.rs"
required-features = ["theme"]

[[example]]
name = "step_sizes"
path = "examples/step_sizes.rs"
required-features = ["theme"]

[[example]]
name = "borders"
path = "examples/borders.rs"
required-features = ["theme"]

[[example]]
name = "horizontal_bar_alignment"
path = "examples/horizontal_bar_alignment.rs"
required-features = ["theme"]

[[example]]
name = "title_alignment"
path = "examples/title_alignment.rs"
required-features = ["theme"]

[[example]]
name = "value_alignment"
path = "examples/value_alignment.rs"
required-features = ["theme"]

[profile.dev]
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
strip = true
