name: Nightly Dependency Update

on:
  schedule:
    # Runs every night at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    name: Update dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Update Cargo.lock
        run: cargo update

      - name: Build
        run: cargo build --all-features --all-targets

      - name: Run tests
        run: cargo test --locked --all-features --all-targets

      - name: Check for changes
        id: git-check
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Direct push, not a PR -- a PR here would need a human to merge it
      # before auto-release.yml's Cargo.lock-path trigger ever fires, which
      # defeats the point of a *nightly, unattended* update. Quality gate
      # (build + test above) already passed before this runs.
      - name: Commit and push dependency update
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name  "gitea-actions[bot]"
          git config user.email "gitea-actions[bot]@noreply.gitea"
          git add Cargo.lock
          git commit -m "chore(deps): nightly dependency update"
          git push origin HEAD:${{ github.ref_name }}
          echo "✅ Dependency update pushed — auto-release.yml will bump + tag + release it."
