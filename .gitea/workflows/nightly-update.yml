name: Nightly Dependency Update

on:
  schedule:
    # Offset from GitHub to reduce duplicate releases when repositories mirror.
    - cron: "30 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-dependency-update
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  UPDATE_BRANCH: chore/nightly-dependency-update

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    name: Update libraries and auto-merge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-edit
        run: cargo install cargo-edit --locked

      - name: Install Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: "*"

      - name: Upgrade libraries without downgrades
        run: |
          cargo metadata --no-deps --format-version 1 | jq -S -c '[.packages[].dependencies[] | {name,req,kind,features,optional,target,uses_default_features}] | sort_by(.name,.kind)' > "$RUNNER_TEMP/deps_before.json"
          nu scripts/upgrade_deps.nu --no-commit

      - name: Reject non-library changes
        run: |
          if ! git diff --quiet -- . ':(exclude)Cargo.toml' ':(exclude)Cargo.lock'; then
            echo "Nightly update changed files other than Cargo.toml/Cargo.lock:"
            git diff --name-only
            exit 1
          fi

      - name: Build updated dependency set
        run: cargo build --locked --all-features --all-targets

      # `release` is true ONLY when dependency requirements declared in
      # Cargo.toml really changed (consumers resolve from those, never from our
      # Cargo.lock). Lock-only refreshes are merged but never released.
      # cargo-edit may reserialize Cargo.toml cosmetically; that is discarded.
      - name: Check for changes
        id: git-check
        run: |
          cargo metadata --no-deps --format-version 1 | jq -S -c '[.packages[].dependencies[] | {name,req,kind,features,optional,target,uses_default_features}] | sort_by(.name,.kind)' > "$RUNNER_TEMP/deps_after.json"
          if cmp -s "$RUNNER_TEMP/deps_before.json" "$RUNNER_TEMP/deps_after.json"; then
            REQ=0
            git checkout -- Cargo.toml
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "title=chore(deps): update Cargo.lock" >> "$GITHUB_OUTPUT"
          else
            REQ=1
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "title=chore(deps): nightly library update" >> "$GITHUB_OUTPUT"
          fi
          if [ "$REQ" = 0 ] && git diff --quiet -- Cargo.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push dependency branch
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "gitea-actions[bot]"
          git config user.email "gitea-actions[bot]@noreply.gitea"
          git checkout -b "$UPDATE_BRANCH"
          git add Cargo.toml Cargo.lock
          git commit -m "${{ steps.git-check.outputs.title }}"
          git push --force origin "HEAD:refs/heads/$UPDATE_BRANCH"

      - name: Create and merge validated pull request
        id: merge-pr
        if: steps.git-check.outputs.changed == 'true'
        env:
          GITEA_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          API_URL: ${{ github.server_url }}/api/v1
          REPOSITORY: ${{ github.repository }}
        run: |
          pulls=$(curl --fail-with-body --silent --show-error \
            --header "Authorization: token $GITEA_TOKEN" \
            "$API_URL/repos/$REPOSITORY/pulls?state=open&limit=50")

          number=$(printf '%s' "$pulls" | jq -r \
            --arg branch "$UPDATE_BRANCH" \
            '.[] | select(.head.ref == $branch) | .number' | head -n 1)

          if [ -z "$number" ]; then
            payload=$(jq -n \
              --arg head "$UPDATE_BRANCH" \
              --arg base "$BASE_BRANCH" \
              --arg title "${{ steps.git-check.outputs.title }}" \
              --arg body $'Automated nightly library update.\n\n- Direct requirements upgraded\n- Lockfile refreshed\n- Downgrades rejected\n- Formatting, Clippy, tests, and build passed\n\nThis workflow merges the validated PR and explicitly dispatches the patch release.' \
              '{head: $head, base: $base, title: $title, body: $body}')
            created=$(curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: token $GITEA_TOKEN" \
              --header "Content-Type: application/json" \
              --data "$payload" \
              "$API_URL/repos/$REPOSITORY/pulls")
            number=$(printf '%s' "$created" | jq -r '.number')
          fi

          merge_payload=$(jq -n '{Do: "squash", delete_branch_after_merge: true}')
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: token $GITEA_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$merge_payload" \
            "$API_URL/repos/$REPOSITORY/pulls/$number/merge"

          merged=$(curl --fail-with-body --silent --show-error \
            --header "Authorization: token $GITEA_TOKEN" \
            "$API_URL/repos/$REPOSITORY/pulls/$number" | jq -r '.merged')
          if [ "$merged" != "true" ]; then
            echo "Dependency PR #$number was not merged; refusing to release."
            exit 1
          fi
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch patch release
        if: steps.merge-pr.outputs.merged == 'true' && steps.git-check.outputs.release == 'true'
        env:
          GITEA_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          API_URL: ${{ github.server_url }}/api/v1
          REPOSITORY: ${{ github.repository }}
        run: |
          payload=$(jq -n \
            --arg ref "$BASE_BRANCH" \
            --arg branch "$BASE_BRANCH" \
            '{ref: $ref, inputs: {branch: $branch}}')
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: token $GITEA_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$API_URL/repos/$REPOSITORY/actions/workflows/auto-release.yml/dispatches"
          echo "Patch-release workflow dispatched."
