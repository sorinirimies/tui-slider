name: Auto Patch Release

# Explicit dispatch avoids needing a separate automation credential.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch containing the merged dependency update
        required: true
        default: main
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  actions: write
  contents: write

concurrency:
  group: dependency-auto-release
  cancel-in-progress: false

jobs:
  auto-release:
    name: Bump patch version and tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged dependency update
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install git-cliff
        run: cargo install git-cliff

      - name: Install Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: "*"

      - name: Configure git identity
        run: |
          git config user.name "gitea-actions[bot]"
          git config user.email "gitea-actions[bot]@users.noreply.gitea.io"

      - name: Compute next patch version
        id: version
        run: |
          current=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "tui-slider") | .version')
          IFS='.' read -r major minor patch <<< "$current"
          next="$major.$minor.$((patch + 1))"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Bump version, changelog, commit and tag
        run: nu scripts/bump_version.nu --yes ${{ steps.version.outputs.next }}

      - name: Push release commit and tag to Gitea
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          git push origin "HEAD:refs/heads/$BRANCH"
          git push origin "v${{ steps.version.outputs.next }}"

      - name: Push release commit and tag to GitHub mirror
        env:
          GITHUB_REMOTE_URL: ${{ secrets.GITHUB_REMOTE_URL }}
          BRANCH: ${{ inputs.branch }}
        run: |
          if [ -z "$GITHUB_REMOTE_URL" ]; then
            echo "GITHUB_REMOTE_URL not set; skipping mirror push."
            exit 0
          fi
          git remote add github-ci "$GITHUB_REMOTE_URL"
          git push github-ci "HEAD:refs/heads/$BRANCH"
          git push github-ci "v${{ steps.version.outputs.next }}"

      - name: Dispatch release build
        env:
          GITEA_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch }}
          API_URL: ${{ github.server_url }}/api/v1
          REPOSITORY: ${{ github.repository }}
        run: |
          payload=$(jq -n \
            --arg ref "$BRANCH" \
            --arg tag "v${{ steps.version.outputs.next }}" \
            '{ref: $ref, inputs: {tag: $tag}}')
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: token $GITEA_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$API_URL/repos/$REPOSITORY/actions/workflows/release.yml/dispatches"
