name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy -- -D warnings -A deprecated

      - name: Run tests
        run: cargo test --all-features

  build:
    name: Build and release
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cliff
        run: cargo install git-cliff

      # hustcer/setup-nu needs Node >= 20 (global `File`); the Gitea runner has Node 18.
      - name: Install Nushell
        run: |
          case "$(uname -m)" in
            x86_64) arch=x86_64-unknown-linux-gnu ;;
            aarch64|arm64) arch=aarch64-unknown-linux-gnu ;;
            *) echo "unsupported arch"; exit 1 ;;
          esac
          tag=$(curl -fsSL https://api.github.com/repos/nushell/nushell/releases/latest | grep -m1 '"tag_name"' | cut -d'"' -f4)
          curl -fsSL "https://github.com/nushell/nushell/releases/download/${tag}/nu-${tag}-${arch}.tar.gz" | tar xz -C /tmp
          install -d "$HOME/.local/bin"
          cp /tmp/nu-${tag}-${arch}/nu "$HOME/.local/bin/nu"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/nu" --version

      - name: Prepare release artifacts
        run: nu scripts/release_prepare.nu ${{ env.RELEASE_TAG }}

      - name: Build release
        run: cargo build --release --all-features

      - name: Create Gitea Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: RELEASE_NOTES.md
          files: |
            LICENSE
            README.md
            CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to crates.io
        if: env.CRATES_IO_TOKEN != ''
        env:
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          echo "Publishing to crates.io..."
          cargo publish --token "$CRATES_IO_TOKEN" --allow-dirty

      - name: Skip crates.io publish
        if: env.CRATES_IO_TOKEN == ''
        env:
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          echo "⚠️  CRATES_IO_TOKEN not set. Skipping crates.io publication."
          echo "To publish to crates.io, add CRATES_IO_TOKEN to your GitHub secrets."
