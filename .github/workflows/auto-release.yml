name: Auto Patch Release

# Explicit dispatch avoids needing a PAT: workflow_dispatch events are allowed
# when invoked with the repository's built-in workflow credential.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch containing the merged dependency update
        required: true
        default: main
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  actions: write
  contents: write

concurrency:
  group: dependency-auto-release
  cancel-in-progress: false

jobs:
  auto-release:
    name: Bump patch version and tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged dependency update
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install git-cliff
        run: cargo install git-cliff

      - name: Install Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: "*"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute next patch version
        id: version
        run: |
          current=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "tui-slider") | .version')
          IFS='.' read -r major minor patch <<< "$current"
          next="$major.$minor.$((patch + 1))"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Bump version, changelog, commit and tag
        run: nu scripts/bump_version.nu --yes ${{ steps.version.outputs.next }}

      - name: Push release commit and tag to GitHub
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          git push origin "HEAD:refs/heads/$BRANCH"
          git push origin "v${{ steps.version.outputs.next }}"

      - name: Push release commit and tag to Gitea mirror
        env:
          GITEA_REMOTE_URL: ${{ secrets.GITEA_REMOTE_URL }}
          BRANCH: ${{ inputs.branch }}
        run: |
          if [ -z "$GITEA_REMOTE_URL" ]; then
            echo "GITEA_REMOTE_URL not set; skipping mirror push."
            exit 0
          fi
          git remote add gitea-ci "$GITEA_REMOTE_URL"
          git push gitea-ci "HEAD:refs/heads/$BRANCH"
          git push gitea-ci "v${{ steps.version.outputs.next }}"

      - name: Dispatch release build
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch }}
        run: |
          gh workflow run release.yml \
            --ref "$BRANCH" \
            -f tag="v${{ steps.version.outputs.next }}"
