name: Nightly Dependency Update

on:
  schedule:
    # Runs every night at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    name: Update dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Update Cargo.lock
        run: cargo update

      - name: Build
        run: cargo build --all-features --all-targets

      - name: Run tests
        run: cargo test --locked --all-features --all-targets

      - name: Check for changes
        id: git-check
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.git-check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): nightly dependency update"
          title: "chore(deps): nightly dependency update"
          body: |
            Automated nightly update of `Cargo.lock` dependencies.

            Generated by the `nightly-update` workflow. Build and tests passed
            with the updated dependency versions before this PR was opened.
          branch: chore/nightly-dependency-update
          delete-branch: true
          labels: |
            dependencies
            automated
