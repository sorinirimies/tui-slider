name: Nightly Dependency Update

on:
  schedule:
    # Runs every night at 03:00 UTC.
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-dependency-update
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    name: Update libraries and auto-merge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-edit
        run: cargo install cargo-edit --locked

      - name: Install Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: "*"

      - name: Upgrade libraries without downgrades
        run: |
          cargo metadata --no-deps --format-version 1 | jq -S -c '[.packages[].dependencies[] | {name,req,kind,features,optional,target,uses_default_features}] | sort_by(.name,.kind)' > "$RUNNER_TEMP/deps_before.json"
          nu scripts/upgrade_deps.nu --no-commit

      - name: Reject non-library changes
        run: |
          if ! git diff --quiet -- . ':(exclude)Cargo.toml' ':(exclude)Cargo.lock'; then
            echo "Nightly update changed files other than Cargo.toml/Cargo.lock:"
            git diff --name-only
            exit 1
          fi

      - name: Build updated dependency set
        run: cargo build --locked --all-features --all-targets

      # `release` is true ONLY when dependency requirements declared in
      # Cargo.toml really changed (consumers resolve from those, never from our
      # Cargo.lock). Lock-only refreshes are merged but never released.
      # cargo-edit may reserialize Cargo.toml cosmetically; that is discarded.
      - name: Check for changes
        id: git-check
        run: |
          cargo metadata --no-deps --format-version 1 | jq -S -c '[.packages[].dependencies[] | {name,req,kind,features,optional,target,uses_default_features}] | sort_by(.name,.kind)' > "$RUNNER_TEMP/deps_after.json"
          if cmp -s "$RUNNER_TEMP/deps_before.json" "$RUNNER_TEMP/deps_after.json"; then
            REQ=0
            git checkout -- Cargo.toml
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "title=chore(deps): update Cargo.lock" >> "$GITHUB_OUTPUT"
          else
            REQ=1
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "title=chore(deps): nightly library update" >> "$GITHUB_OUTPUT"
          fi
          if [ "$REQ" = 0 ] && git diff --quiet -- Cargo.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update dependency pull request
        id: create-pr
        if: steps.git-check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          add-paths: |
            Cargo.toml
            Cargo.lock
          commit-message: ${{ steps.git-check.outputs.title }}
          title: ${{ steps.git-check.outputs.title }}
          body: |
            Automated nightly library update.

            - Direct dependency requirements upgraded to latest releases
            - Lockfile refreshed
            - Dependency downgrades rejected
            - Formatting, Clippy, tests, and build passed

            This workflow merges the validated PR and explicitly dispatches
            the patch-release workflow.
          branch: chore/nightly-dependency-update
          delete-branch: true

      - name: Merge validated dependency pull request
        id: merge-pr
        if: steps.create-pr.outputs.pull-request-operation == 'created' || steps.create-pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          gh pr merge "$PR_NUMBER" --squash --delete-branch
          state=$(gh pr view "$PR_NUMBER" --json state --jq '.state')
          if [ "$state" != "MERGED" ]; then
            echo "Dependency PR was not merged; refusing to release."
            exit 1
          fi
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch patch release
        if: steps.merge-pr.outputs.merged == 'true' && steps.git-check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run auto-release.yml --ref "$BASE_BRANCH" -f branch="$BASE_BRANCH"
